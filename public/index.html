<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Recipe Box</title>
    <meta name="description" content="My saved recipes from Instagram and around the web." />
    <meta name="theme-color" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Recipes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="preload" href="/fonts/manrope.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/styles.css" />
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <div id="list-view">
      <header class="topbar">
        <div class="topbar-row">
          <h1 class="app-title">Recipe Box</h1>
          <button class="icon-btn" id="settings-btn" aria-label="Settings">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/></svg>
          </button>
        </div>
        <label class="search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="search" type="search" placeholder="Search dishes, ingredients, creators" autocomplete="off" enterkeyhint="search" />
        </label>
        <nav class="chips" id="filters" aria-label="Filters"></nav>
      </header>

      <main>
        <div class="list-head" id="list-head"><h2 id="list-title">Saved</h2><span id="count"></span></div>
        <section class="grid" id="grid" aria-live="polite"></section>
        <section class="empty" id="empty" hidden></section>
      </main>

      <button class="fab" id="add-btn">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        <span>Add recipe</span>
      </button>
    </div>

    <div id="detail-view" class="detail" hidden></div>

    <dialog id="sheet" class="sheet"></dialog>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  </body>
</html>
